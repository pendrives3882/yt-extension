<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
    }
    h2 {
      color: #ff0000;
      margin: 0 0 12px;
      font-size: 16px;
    }
    #thumbnail {
      width: 100%;
      border-radius: 8px;
      display: none;
      margin-bottom: 10px;
    }
    #title {
      font-size: 13px;
      margin-bottom: 10px;
      color: #ccc;
      display: none;
    }
    #status {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    #fetchBtn {
      background: #ff0000;
      color: #fff;
    }
    #downloadBtn {
      background: #00c853;
      color: #fff;
      display: none;
    }
  </style>
</head>
<body>
  <h2>▶ YT Video Downloader</h2>
  <div id="status">YouTube page pe jao aur icon click karo</div>
  <img id="thumbnail" src="" alt="thumbnail">
  <div id="title"></div>
  <button class="btn" id="fetchBtn">Get Download Link</button>
  <button class="btn" id="downloadBtn">⬇ Download Video</button>
  <script src="popup.js"></script>
</body>
</html>
